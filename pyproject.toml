[project]
name = "ledger"
version = "0.1.0"
description = "Local equity research instrument for Canadian (TSX/TSXV) and cross-listed North American equities."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "jinja2>=3.1",
]

[project.optional-dependencies]
interpret = ["anthropic>=0.34"]
dev = ["pytest>=8.2", "pytest-cov>=5.0"]

[project.scripts]
ledger = "ledger.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
