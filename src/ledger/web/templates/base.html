<!doctype html>
<html><head><meta charset="utf-8"><title>{% block title %}ledger{% endblock %}</title>
<style>
:root{--bg:#0f1115;--fg:#e6e6e6;--dim:#8b93a1;--line:#242833;--null:#c9a227;--bad:#d9534f;--ok:#4a9d5f;--acc:#5aa0d6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;gap:20px;align-items:baseline}
h1{font-size:16px;margin:0;letter-spacing:.5px}main{padding:20px;max-width:1400px}
table{border-collapse:collapse;width:100%;margin:12px 0}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--dim);font-weight:normal;text-transform:uppercase;font-size:11px;letter-spacing:.6px}
.null{color:var(--null)}.na{color:var(--dim);font-style:italic}.bad{color:var(--bad)}.ok{color:var(--ok)}
.badge{display:inline-block;padding:1px 7px;border:1px solid var(--line);border-radius:10px;font-size:11px;color:var(--dim)}
.badge.low{border-color:var(--null);color:var(--null)}.badge.blocked{border-color:var(--bad);color:var(--bad)}
.banner{border:1px solid var(--bad);background:rgba(217,83,79,.08);padding:10px 14px;margin:10px 0;border-radius:4px}
.warn{border:1px solid var(--null);background:rgba(201,162,39,.08);padding:8px 14px;margin:8px 0;border-radius:4px;color:var(--null)}
.meta{color:var(--dim);font-size:12px}
details{margin:4px 0}summary{cursor:pointer;color:var(--dim)}
code{color:var(--dim);word-break:break-all}
.wrap{overflow-x:auto}
</style></head><body>
<header><h1>ledger</h1><a href="/">universe</a>{% block nav %}{% endblock %}
<span class="meta" style="margin-left:auto">reads the database only &mdash; refresh runs in the CLI</span></header>
<main>{% block body %}{% endblock %}</main></body></html>
